spring:
  application:
    name: taxt-ve-qilinc-slg
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taxtveqilinc?createDatabaseIfNotExist=true}
    username: ${DB_USER:game}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:game}
    password: ${RABBITMQ_PASSWORD:change-me}
app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzRGV2ZWxvcG1lbnRPbmx5U2VjcmV0S2V5Rm9yVGF4dFZlUWlsaW5j}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true