<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17211d"><title>Taxt və Qılınc — Dünya xəritəsi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#18231d;color:#f4ead6;font-family:system-ui,sans-serif}header{padding:16px;background:linear-gradient(130deg,#263a2d,#111b19);border-bottom:1px solid #87734d}h1{font-size:18px;margin:0}p{font-size:12px;color:#d6c7a8;margin:5px 0 0}.wrap{padding:12px;max-width:760px;margin:auto}.map{position:relative;overflow:hidden;border:1px solid #8d7952;border-radius:14px;background:radial-gradient(ellipse at 50% 45%,#748052,#455c3d 65%,#2e4534);height:min(65vh,520px);min-height:360px;box-shadow:inset 0 0 60px #101a19}.map:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(28deg,transparent 0 38px,#c5b27b22 39px 41px),repeating-linear-gradient(112deg,transparent 0 65px,#1a2a1e33 66px 68px);transform:rotate(-8deg)}.river{position:absolute;width:130%;height:42px;left:-12%;top:48%;background:#557d83;border:3px solid #9db0a0;transform:rotate(-23deg);border-radius:50%;opacity:.9}.road{position:absolute;width:80%;height:7px;left:10%;top:52%;background:#c4ae7a;transform:rotate(-22deg);border-radius:10px;box-shadow:0 0 0 2px #594d36}.place{position:absolute;z-index:2;border:1px solid #e0c88d;border-radius:10px;background:#202b22eF;color:#fff1d3;padding:8px 10px;font-size:11px;font-weight:700;box-shadow:0 3px 12px #0008;transform:translate(-50%,-50%)}.place small{display:block;font-weight:400;color:#d8c7a3}.place.selected{outline:3px solid #f3d17b;background:#5a3927}.place.fortress-owned{background:linear-gradient(135deg,#385b3d,#1d3426);border:2px solid #e8cf83;box-shadow:0 0 0 3px #d6b66a55,0 4px 16px #000a}.place.fortress-owned span{color:#ffe7a6}.place.fortress-owned small{color:#d7efbd}.place.fortress-damaged{border-color:#d58a56;box-shadow:0 0 0 2px #a94e3155,0 0 13px #b64b2d99,0 4px 12px #000b}.place.fortress-damaged:after{content:'⚒ '+var(--fortress-damage);position:absolute;right:-7px;top:-12px;padding:2px 5px;border-radius:6px;background:#702f25;color:#ffe0b8;font-size:9px;border:1px solid #d58a56}.place.fortress-damaged.fortress-owned{border-color:#e2a36a}.frontier-marker{position:absolute;z-index:3;transform:translate(-50%,-50%);border:1px solid #f0d28b;border-radius:50%;width:46px;height:46px;padding:0;background:linear-gradient(145deg,#42533b,#18241e);font-size:22px;box-shadow:0 0 0 3px #d6b66a55,0 4px 12px #000b}.frontier-marker:after{content:attr(data-label);position:absolute;top:46px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 6px;border-radius:5px;background:#18231ded;color:#f8e7bd;font-size:9px}.frontier-marker:active{outline:3px solid #f3d17b}.frontier-info{margin-top:10px;padding:10px;border:1px solid #9a8052;border-radius:9px;background:#1c2b23;font-size:12px}.capital{left:22%;top:64%}.village{left:70%;top:25%}.forest{left:27%;top:19%}.enemy{left:76%;top:70%;background:#572c28}.mine{left:50%;top:39%}.march-dot{display:none;position:absolute;z-index:4;left:22%;top:64%;font-size:24px;filter:drop-shadow(0 2px 4px #000);animation:marchMove 8s linear infinite}.march-dot[style*="animation: none"]{animation:none;transition:left .45s linear,top .45s linear;filter:drop-shadow(0 0 7px #ffd36a)}#returnJourneyPanel{border-color:#a58a54}#returnJourneyPanel a{background:#31513c}.return-progress{height:8px;margin:12px 0;background:#27332d;border:1px solid #756448;border-radius:99px;overflow:hidden}.return-progress div{height:100%;width:0;background:linear-gradient(90deg,#9a7438,#f3d17b);transition:width .45s linear}.return-composition{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.return-composition span{padding:6px 8px;border-radius:7px;background:#26342b;color:#f3e5c5;font-size:11px}@keyframes marchMove{0%{left:22%;top:64%}100%{left:76%;top:70%}}.path{position:absolute;z-index:1;left:25%;top:65%;width:52%;height:2px;background:#f4d27e;transform:rotate(5deg);transform-origin:left;display:none;box-shadow:0 0 7px #fff}.panel{margin-top:12px;background:#111c20;border:1px solid #756448;border-radius:12px;padding:13px}.panel h2{font-size:15px;margin:0 0 6px}.panel p{line-height:1.5}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button,a{border:1px solid #b49a6b;border-radius:9px;background:#59452d;color:#fff1d9;padding:11px 13px;font-size:12px;font-weight:700;text-decoration:none}button:disabled{opacity:.4}.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.stats span{font-size:11px;padding:6px 8px;background:#26342b;border-radius:7px}
</style></head><body><header><h1>TAxt VƏ QILINC · DÜNYA XƏRİTƏSİ</h1><p>Krallığın ətrafını kəşf et və yürüş hədəfini seç</p></header>
<main class="wrap"><div class="map" id="map"><div class="river"></div><div class="road"></div><div class="path" id="path"></div>
<button class="place capital" data-id="capital"><span>🏰 Paytaxt</span><small>Sənin qalən</small></button>
<button class="place village" data-id="village"><span>🏘 Sərhəd kəndi</span><small>Kiçik yaşayış məntəqəsi</small></button>
<button class="place forest" data-id="forest"><span>🌲 Qaranlıq meşə</span><small>Kəşf edilməmiş ərazi</small></button>
<button class="place mine" data-id="mine"><span>⛏ Dəmir mədəni</span><small>Resurs məntəqəsi</small></button>
<button class="place enemy" data-id="enemy"><span>🛡 Düşmən qalası</span><small>Müdafiə: 300 əsgər</small></button></div>
<section class="panel"><h2 id="targetTitle">Hədəf seçilməyib</h2><p id="description">Xəritədə bir məntəqəyə toxun. Düşmən qalasına hücum üçün ordunu göndərə bilərsən.</p><div class="stats" id="armyStats"></div><div class="actions"><button id="march" disabled>⚔ Yürüşə başla</button><a href="./city.html">← Şəhərə qayıt</a></div></section></main>
